<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>শুভ ৬০তম জন্মদিন বাবা ❤️</title>	    
    <link type="text/css" rel="stylesheet" href="./file/default.css">
    <script type="text/javascript" src="./file/jquery.min.js"></script>
    <script type="text/javascript" src="./file/jscex.min.js"></script>
    <script type="text/javascript" src="./file/jscex-parser.js"></script>
    <script type="text/javascript" src="./file/jscex-jit.js"></script>
    <script type="text/javascript" src="./file/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./file/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./file/love.js" charset="utf-8"></script>
    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
</head>
<body>
    <div id="main">
        <div id="error"><a href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a> (<a href="http://firefox.com.cn/download/">Firefox</a>)</div>
        <audio autoplay="autoplay" height="100" width="100" id="myAudio">
            <source src="aud.mp3" type="audio/mp3" />
            <embed height="100" width="100" src="aud.mp3" />
        </audio>
        <div id="wrap">
            <div id="text">
                <div id="text">
            <div id="code">
                <span class="say">আমার  প্রিয়  বাবা</span><br />
                <span class="say">শুভ ৬০তম জন্মদিন 🎉🎂</span><br />
                <span class="say">শুভ জন্মদিন বাবা!</span><br />
                <span class="say">আমি তোমাকে খুব ভালোবাসি ❤️</span><br />
                <span class="say">তুমি আমার জীবনের সবচেয়ে বড় অনুপ্রেরণা।</span><br />
                <span class="say">সুস্থ থেকো, ভালো থেকো।</span><br />
                <span class="say">                           - Sona</span><br/>
            </div>
        </div>
            </div>
            <div id="clock-box">
                <span id="clock-label">Time on Earth: </span>
                <span id="clock"></span>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
    </div>

    <script>
    (function() {
        var canvas = $('#canvas');
		
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        var width = canvas.width();
        var height = canvas.height();        
        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = {
            seed: {
                x: width / 2 - 20,
                color: "rgb(190, 26, 37)",
                scale: 2
            },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]] 
            ],
            bloom: {
                num: 700,
                width: 1080,
                height: 650,
            },
            footer: {
                width: 1200,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 0;

        canvas.click(function(e) {
            playAudio();
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            if (seed.hover(x, y)) {
                hold = 0; 
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function(e) {
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 2);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        var textAnimate = eval(Jscex.compile("async", function () {
            $("#code").show().typewriter();
        }));

	    
        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            textAnimate().start();
            $("#clock-box").fadeIn(1000);          // show clock
            setInterval(updateLiveCounter, 1000); // live update
            updateLiveCounter();                  // run once immediately


            // wait enough time for ALL lines to type
            $await(Jscex.Async.sleep(16000));

            // fireworks 
            if (typeof startFireworksShow === 'function') {
                startFireworksShow(15000);
            }
        }));
        function updateLiveCounter() {
    var startDate = new Date("1966-02-13 00:00:00"); 
    var now = new Date();

    var diff = now - startDate;

    var seconds = Math.floor(diff / 1000);
    var days = Math.floor(seconds / (24 * 60 * 60));
    seconds %= (24 * 60 * 60);

    var hours = Math.floor(seconds / (60 * 60));
    seconds %= (60 * 60);

    var minutes = Math.floor(seconds / 60);
    seconds %= 60;

    document.getElementById("clock").innerHTML =
        days + " days " +
        hours + " hours " +
        minutes + " minutes " +
        seconds + " seconds";
}

        runAsync().start();
        
    })();
    </script>
    <canvas id="fireworks"></canvas>

<style>
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
    background: transparent;
}
</style>

<script>
(function() {
    var fireCanvas = document.getElementById("fireworks");
    var fctx = fireCanvas.getContext("2d");
    fireCanvas.width = window.innerWidth;
    fireCanvas.height = window.innerHeight;

    var particles = [];
    var fireworksShowEnded = false;

    function fireRandom(min, max) {
        return Math.random() * (max - min) + min;
    }

    function createFirework(x, y) {
        var count = 220;
        for (var i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                angle: fireRandom(0, Math.PI * 2),
                speed: fireRandom(3, 8),
                alpha: 1,
                radius: fireRandom(2.5, 5),
                decay: fireRandom(0.004, 0.012),
                hue: fireRandom(0, 360)
            });
        }
    }

    function startFireworksShow(durationMs) {
        durationMs = durationMs || 12000;
        fireworksShowEnded = false;
        var burstInterval = setInterval(function() {
            createFirework(
                fireRandom(150, fireCanvas.width - 150),
                fireRandom(150, fireCanvas.height - 200)
            );
        }, 650);
        setTimeout(function() {
            clearInterval(burstInterval);
            fireworksShowEnded = true;
        }, durationMs);
    }

    function animateFire() {
        fctx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);

        for (var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;
            p.alpha -= p.decay;

            fctx.fillStyle = "hsla(" + p.hue + ",100%,75%," + p.alpha + ")";
            fctx.beginPath();
            fctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            fctx.fill();

            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        if (fireworksShowEnded && particles.length === 0) {
            return;
        }
        requestAnimationFrame(animateFire);
    }

    window.startFireworksShow = startFireworksShow;
    animateFire();
})();
</script>

</body>
</html>
